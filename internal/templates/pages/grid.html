{{ define "media/grid" }}
<div class="media-page">
  <div class="page-head">
    <h1>{{ .Heading }}</h1>
    {{ if .Cards }}<span class="count">{{ len .Cards }}</span>{{ end }}
  </div>
  {{ if .Unavailable }}
  <p class="unavailable">{{ t .Lang "unavailable" }}</p>
  {{ else if .Cards }}
  <div class="grid">{{ range .Cards }}{{ template "media/card" . }}{{ end }}</div>
  {{ else }}
  <p class="empty">{{ .Empty }}</p>
  {{ end }}
</div>
{{ end }}
