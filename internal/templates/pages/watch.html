{{ define "media/watch" }}
<div id="player" class="player" tabindex="-1"
  data-item="{{ .Item }}" data-series="{{ .Series }}" data-parts="{{ .Parts }}" data-part="{{ .Part }}"
  data-start="{{ .Start }}" data-back="{{ .Back }}" data-labels="{{ .Labels }}">
  <svg class="player-icons" aria-hidden="true" focusable="false">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.1v13.8a1 1 0 0 0 1.5.9l10.8-6.9a1 1 0 0 0 0-1.7L9.5 4.3A1 1 0 0 0 8 5.1z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/></symbol>
    <symbol id="i-back10" viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" font-size="7" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">10</text></symbol>
    <symbol id="i-fwd10" viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5" font-size="7" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif">10</text></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm18.7 1.1-1.4-1.4L18 11l-2.3-2.3-1.4 1.4 2.3 2.3-2.3 2.3 1.4 1.4L18 13.8l2.3 2.3 1.4-1.4-2.3-2.3z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.2 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-2.7a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></symbol>
    <symbol id="i-exit-fullscreen" viewBox="0 0 24 24"><path d="M8 4h2v6H4V8h4zm6 0h2v4h4v2h-6zM4 14h6v6H8v-4H4zm10 0h6v2h-4v4h-2z"/></symbol>
  </svg>
  <video playsinline preload="metadata"></video>
  <div class="player-spinner" hidden></div>
  <div class="player-flash left" hidden></div>
  <div class="player-flash right" hidden></div>
  <p class="player-error" hidden></p>
  <div class="player-top">
    <a class="player-button" href="{{ .Back }}" data-action="back" aria-label='{{ t .Lang "player.back" }}'><svg><use href="#i-back"/></svg></a>
    <span class="player-title">{{ .Title }}</span>
  </div>
  <div class="player-center">
    <button type="button" class="player-button" data-action="back10" aria-label='{{ t .Lang "player.back10" }}'><svg><use href="#i-back10"/></svg></button>
    <button type="button" class="player-button player-toggle" data-action="toggle" aria-label='{{ t .Lang "player.play" }}'><svg><use href="#i-play"/></svg></button>
    <button type="button" class="player-button" data-action="forward10" aria-label='{{ t .Lang "player.forward10" }}'><svg><use href="#i-fwd10"/></svg></button>
  </div>
  <div class="player-menu" role="menu" hidden>
    <section data-group="subtitles" role="group" aria-labelledby="player-menu-subtitles"><h3 id="player-menu-subtitles">{{ t .Lang "player.subtitles" }}</h3><ul role="none"></ul></section>
    <section data-group="audio" role="group" aria-labelledby="player-menu-audio" hidden><h3 id="player-menu-audio">{{ t .Lang "player.audio" }}</h3><ul role="none"></ul></section>
  </div>
  <div class="player-controls">
    <div class="player-timeline">
      <span class="player-current">0:00</span>
      <div class="player-seek" role="slider" tabindex="0" aria-label='{{ t .Lang "player.seek" }}' aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="player-track"><div class="player-buffered"></div><div class="player-played"></div></div>
        <div class="player-thumb"></div>
        <div class="player-bubble" hidden></div>
      </div>
      <span class="player-total">0:00</span>
    </div>
    <div class="player-bar">
      <span class="player-skip">
        <button type="button" class="player-button" data-action="back10" aria-label='{{ t .Lang "player.back10" }}'><svg><use href="#i-back10"/></svg></button>
        <button type="button" class="player-button player-toggle" data-action="toggle" aria-label='{{ t .Lang "player.play" }}'><svg><use href="#i-play"/></svg></button>
        <button type="button" class="player-button" data-action="forward10" aria-label='{{ t .Lang "player.forward10" }}'><svg><use href="#i-fwd10"/></svg></button>
      </span>
      <button type="button" class="player-button" data-action="mute" aria-label='{{ t .Lang "player.mute" }}'><svg><use href="#i-volume"/></svg></button>
      <input class="player-volume" type="range" min="0" max="1" step="0.05" value="1" aria-label='{{ t .Lang "player.volume" }}' />
      <span class="player-spacer"></span>
      <button type="button" class="player-button" data-action="settings" aria-haspopup="true" aria-expanded="false" aria-label='{{ t .Lang "player.settings" }}'><svg><use href="#i-settings"/></svg></button>
      <button type="button" class="player-button" data-action="fullscreen" aria-label='{{ t .Lang "player.fullscreen" }}'><svg><use href="#i-fullscreen"/></svg></button>
    </div>
  </div>
</div>
<script src="/static/media/js/hls.min.js?v={{ assetVersion }}"></script>
<script src="/static/media/js/player.js?v={{ assetVersion }}"></script>
{{ end }}
